# Xcode project definition. Regenerate MyMovieLog.xcodeproj with `xcodegen` after editing.
name: MyMovieLog
options:
  bundleIdPrefix: com.mymovie
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MyMovieLogKit:
    path: MyMovieLogKit
targets:
  MyMovieLog:
    type: application
    platform: iOS
    sources:
      - path: MyMovieLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mymovie.log
        INFOPLIST_FILE: MyMovieLog/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: MyMovieLogKit
        product: Domain
      - package: MyMovieLogKit
        product: DataLayer
      - package: MyMovieLogKit
        product: Presentation
schemes:
  MyMovieLog:
    build:
      targets:
        MyMovieLog: all
    test:
      targets:
        - package: MyMovieLogKit/DomainTests
        - package: MyMovieLogKit/DataLayerTests
        - package: MyMovieLogKit/PresentationTests
